<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: left;
        width: 400px;
      }
      h2 {
        color: #333;
        font-size: 22px;
        margin-bottom: 20px;
        text-align: center;
      }
      .course-info {
        margin-bottom: 15px;
        padding: 12px 15px;
        background-color: #f9f9f9;
        border-left: 4px solid #3498db;
        border-radius: 8px;
      }
      strong {
        color: #555;
      }
      p {
        margin: 8px 0;
        line-height: 1.6;
      }
      .btn-container {
        margin-top: 20px;
        text-align: center;
      }
      a {
        text-decoration: none;
        color: #fff;
        background-color: #3498db;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        transition: background-color 0.3s ease;
      }
      a:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>{{ course.course_name }}</h2>

      <div class="course-info">
        <p>
          <p><strong>Professor:</strong> {{ course.professor.first_name }} {{ course.professor.last_name }}</p>
        </p>
      </div>

      <div class="course-info">
        <p><strong>Room:</strong> {{ course.room.room_name }}</p>
      </div>

      <div class="course-info">
        <p>
          <p><strong>Semester:</strong> {{ course.semester.term }} {{course.semester.academic_year }}</p>
        </p>
      </div>

      <div class="course-info">
        <p><strong>Start Time:</strong> {{ course.start_time }}</p>
      </div>

      <div class="course-info">
        <p><strong>End Time:</strong> {{ course.end_time }}</p>
      </div>

      <div class="btn-container">
        <a href="{% url 'admin_courses_manage' %}">Back to Courses</a>
      </div>
    </div>
  </body>
</html>
