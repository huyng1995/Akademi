{% extends "admin_base.html" %} {% block body %}
<!-- content here -->
<div class="container">
  <div class="page-inner">
    <div
      class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4"
    ></div>

    <div class="row">
      <div class="col-md-12">
        <div class="card card-round">
          <div class="card-header">
            <div class="card-head-row card-tools-still-right">
              <h4 class="card-title">Manage Course Here</h4>
              <div class="card-tools">

                <a
                  href="{% url 'admin_courses_create' %}"
                  class="btn btn-primary btn-xs"
                  style="
                    margin-left: 10px;
                    padding: 5px 10px;
                    font-weight: bold;
                    font-size: 1em;
                  "
                  ><i class="fa fa-plus me-1"></i> Add New Course</a>

                <button
                  class="btn btn-icon btn-link btn-primary btn-xs btn-refresh-card">
                  <span class="fa fa-sync-alt"></span>
                </button>

              </div>
            </div>
          </div>
          <div class="card-body">
            <div>{% include "administrators/admin_course_detail.html" %}</div>
            <div class="d-flex justify-content-center">
              <div
                class="border rounded"
                data-coreui-locale="en-US"
                data-coreui-start-date="2024/02/13"
                data-coreui-toggle="calendar"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
