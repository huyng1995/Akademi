<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 350px;
      }
      h2 {
        color: #333;
        font-size: 20px;
        margin-bottom: 20px;
      }
      .btn-container {
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
      }
      button {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background-color: #c0392b;
      }
      a {
        text-decoration: none;
        color: #555;
        padding: 10px 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        transition: background-color 0.3s ease;
      }
      a:hover {
        background-color: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>
        Are you sure you want to delete <br />
        <strong>"{{ course.course_name }}"</strong>?
      </h2>

      <form method="post">
        {% csrf_token %}
        <div class="btn-container">
          <button type="submit">Yes, Delete</button>
          <a href="{% url 'admin_courses_manage' %}">Cancel</a>
        </div>
      </form>
    </div>
  </body>
</html>
