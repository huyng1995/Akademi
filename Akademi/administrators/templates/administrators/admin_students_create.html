{% extends "admin_base.html" %}
{% block body %}
<div class="container">
  <div class="page-inner">
    <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4"></div>

    <div class="row">
      <div class="col-md-12">
        <div class="card card-round">
          <div class="card-header">
            <div class="card-head-row card-tools-still-right">
              <h4 class="card-title">Create Student Here</h4>
              <div class="card-tools">
                <button class="btn btn-icon btn-link btn-primary btn-xs btn-refresh-card">
                  <span class="fa fa-sync-alt"></span>
                </button>
              </div>
            </div>
          </div>

          <div class="card-body">
            <form id="studentForm" method="POST" action="{% url 'create_student' %}" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="table-responsive">
                <table class="table table-bordered">
                  <tbody>
                    <!-- Personal Information -->
                    <tr>
                      <td><strong>First Name</strong></td>
                      <td><input type="text" name="first_name" class="form-control" value="{{ form.first_name.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Middle Name</strong></td>
                      <td><input type="text" name="middle_name" class="form-control" value="{{ form.middle_name.value|default_if_none:'' }}"></td>
                    </tr>
                    <tr>
                      <td><strong>Last Name</strong></td>
                      <td><input type="text" name="last_name" class="form-control" value="{{ form.last_name.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Date of Birth</strong></td>
                      <td><input type="date" name="date_of_birth" class="form-control" value="{{ form.date_of_birth.value|date:'Y-m-d' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Gender</strong></td>
                      <td>
                        <select name="gender" class="form-control" required>
                          <option value="">Select Gender</option>
                          <option value="M" {% if form.gender.value == 'M' %}selected{% endif %}>Male</option>
                          <option value="F" {% if form.gender.value == 'F' %}selected{% endif %}>Female</option>
                          <option value="O" {% if form.gender.value == 'O' %}selected{% endif %}>Other</option>
                        </select>
                      </td>
                    </tr>
                    
                    <!-- Academic Information -->
                    <tr>
                      <td><strong>Enrollment Date</strong></td>
                      <td><input type="date" name="enrollment_date" class="form-control" value="{{ form.enrollment_date.value|date:'Y-m-d' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Grade Level</strong></td>
                      <td>
                        <select name="grade_level" class="form-control" required>
                          <option value="">Select Grade Level</option>
                          <option value="freshman" {% if form.grade_level.value == 'freshman' %}selected{% endif %}>Freshman</option>
                          <option value="sophomore" {% if form.grade_level.value == 'sophomore' %}selected{% endif %}>Sophomore</option>
                          <option value="junior" {% if form.grade_level.value == 'junior' %}selected{% endif %}>Junior</option>
                          <option value="senior" {% if form.grade_level.value == 'senior' %}selected{% endif %}>Senior</option>
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>Total Units</strong></td>
                      <td><input type="number" name="total_units" class="form-control" value="{{ form.total_units.value|default_if_none:'0' }}" min="0" required></td>
                    </tr>
                    <tr>
                      <td><strong>GPA</strong></td>
                      <td><input type="number" step="0.01" min="0" max="4" name="gpa" class="form-control" value="{{ form.gpa.value|default_if_none:'0.00' }}" required></td>
                    </tr>
                    
                    <!-- Account Information -->
                    <tr>
                      <td><strong>Username</strong></td>
                      <td><input type="text" name="username" class="form-control" value="{{ form.username.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Password</strong></td>
                      <td><input type="password" name="password" class="form-control" required></td>
                    </tr>
                    <tr>
                      <td><strong>Email</strong></td>
                      <td><input type="email" name="email" class="form-control" value="{{ form.email.value|default_if_none:'' }}" required></td>
                    </tr>
                    
                    <!-- Avatar Upload -->
                    <tr>
                      <td><strong>Avatar</strong></td>
                      <td><input type="file" name="avatar" class="form-control"></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="custom-btn-save">
                  <i class="fa fa-save"></i> Save Student
                </button>
                <button type="button" class="custom-btn-cancel" onclick="resetForm();">
                  <i class="fa fa-times-circle"></i> Cancel / Reset
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function resetForm() {
    document.getElementById("studentForm").reset();
  }
</script>

<style>
  .custom-btn-save {
    background-color: #1572e8 !important;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background-color 0.3s;
  }
  .custom-btn-save:hover {
    background-color: #0e5bb5 !important;
  }
  .custom-btn-cancel {
    background-color: #f44336;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background-color 0.3s;
  }
  .custom-btn-cancel:hover {
    background-color: #e53935;
  }
  .form-control {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: white;
  }
  select.form-control {
    height: auto;
  }
  input[type="file"].form-control {
    padding: 3px;
  }
  .table td {
    vertical-align: middle;
  }
</style>
{% endblock %}
