{% extends "admin_base.html" %}
{% block body %}
<div class="container">
  <div class="page-inner">
    <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4"></div>

    <div class="row">
      <div class="col-md-12">
        <div class="card card-round">
          <div class="card-header">
            <div class="card-head-row card-tools-still-right">
              <h4 class="card-title">Create Course Here</h4>
              <div class="card-tools">
                <button class="btn btn-icon btn-link btn-primary btn-xs btn-refresh-card">
                  <span class="fa fa-sync-alt"></span>
                </button>
              </div>
            </div>
          </div>

          <div class="card-body">
            <form id="courseForm" method="POST" action="{% url 'create_course' %}">
              {% csrf_token %}
              <div class="table-responsive">
                <table class="table table-bordered">
                  <tbody>
                    <tr>
                      <td><strong>Course Name</strong></td>
                      <td><input type="text" name="course_name" class="form-control" value="{{ form.course_name.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Subject</strong></td>
                      <td><input type="text" name="subject" class="form-control" value="{{ form.subject.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Professor</strong></td>
                      <td><input type="text" name="professor" class="form-control" value="{{ form.professor.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Room</strong></td>
                      <td><input type="text" name="room" class="form-control" value="{{ form.room.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Semester</strong></td>
                      <td><input type="text" name="semester" class="form-control" value="{{ form.semester.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Is Available</strong></td>
                      <td>
                        <div class="form-check">
                          <input type="checkbox" name="isavailable" id="isavailable" class="form-check-input" {% if form.isavailable.value %}checked{% endif %}>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>Start Date & Time</strong></td>
                      <td><input type="datetime-local" name="start_time" class="form-control" value="{{ form.start_time.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>End Date & Time</strong></td>
                      <td><input type="datetime-local" name="end_time" class="form-control" value="{{ form.end_time.value|default_if_none:'' }}" required></td>
                    </tr>
                    <tr>
                      <td><strong>Day</strong></td>
                      <td>
                        <select name="day" class="form-control" required>
                          <option value="">Select Day</option>
                          <option value="Sunday" {% if form.day.value == 'Sunday' %}selected{% endif %}>Sunday</option>
                          <option value="Monday" {% if form.day.value == 'Monday' %}selected{% endif %}>Monday</option>
                          <option value="Tuesday" {% if form.day.value == 'Tuesday' %}selected{% endif %}>Tuesday</option>
                          <option value="Wednesday" {% if form.day.value == 'Wednesday' %}selected{% endif %}>Wednesday</option>
                          <option value="Thursday" {% if form.day.value == 'Thursday' %}selected{% endif %}>Thursday</option>
                          <option value="Friday" {% if form.day.value == 'Friday' %}selected{% endif %}>Friday</option>
                          <option value="Saturday" {% if form.day.value == 'Saturday' %}selected{% endif %}>Saturday</option>
                        </select>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="custom-btn-save">
                  <i class="fa fa-save"></i> Save Course
                </button>
                <button type="button" class="custom-btn-cancel" onclick="resetForm();">
                  <i class="fa fa-times-circle"></i> Cancel / Reset
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function resetForm() {
    document.getElementById("courseForm").reset();
  }
</script>

<style>
  .custom-btn-save {
    background-color: #1572e8 !important;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background-color 0.3s;
  }
  .custom-btn-save:hover {
    background-color: #0e5bb5 !important;
  }
  .custom-btn-cancel {
    background-color: #f44336;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background-color 0.3s;
  }
  .custom-btn-cancel:hover {
    background-color: #e53935;
  }
  .form-control {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: white;
  }
  select.form-control {
    height: auto;
  }
  .table td {
    vertical-align: middle;
  }
  .form-check-input {
    width: 18px;
    height: 18px;
    margin-top: 0.3rem;
  }
  .form-check-label {
    margin-left: 0.5rem;
  }
</style>
{% endblock %}
