{% extends "admin_base.html" %}
{% block body %}
<div class="container">
  <div class="page-inner">
    <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4"></div>

    <div class="row">
      <div class="col-md-12">
        <div class="card card-round">
          <div class="card-header">
            <div class="card-head-row card-tools-still-right">
              <h4 class="card-title">Create Course Here</h4>
              <div class="card-tools">
                <button class="btn btn-icon btn-link btn-primary btn-xs btn-refresh-card">
                  <span class="fa fa-sync-alt"></span>
                </button>
              </div>
            </div>
          </div>

          <div class="card-body">
            <form id="courseForm" method="POST" action="{% url 'create_course' %}">
              {% csrf_token %}
              <div class="table-responsive">
                <table class="table table-bordered">
                  <tbody>
                    <tr>
                      <td><strong>Course Name</strong></td>
                      <td><input type="text" name="course_name" class="form-control" value="{{ form.course_name.value|default_if_none:'' }}" required></td>
                    </tr>
                    <!-- <tr>
                      <td><strong>Subject</strong></td>
                      <td>
                        <select name="professor" class="form-control" required>
                          <option value="">Select Subject</option>
                          {% for sub in subjects %}
                            <option value="{{ prof.professor_id }}">{{ sub.subject_id }}</option>
                          {% endfor %}
                        </select>
                      </td>
                    </tr> -->
                    <tr>
                      <td><strong>Professor</strong></td>
                      <td>
                        <select name="professor" class="form-control" required>
                          <option value="">Select Professor</option>
                          {% for prof in professors %}
                            <option value="{{ prof.professor_id }}">{{ prof.first_name }} {{ prof.last_name }}</option>
                          {% endfor %}
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>Room</strong></td>
                      <td>
                        <select name="room" class="form-control" required>
                          <option value="">Select Room</option>
                          {% for r in rooms %}
                            <option value="{{ r.room_id }}">{{ r.room_name }}</option>
                          {% endfor %}
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>Semester</strong></td>
                      <td>
                        <select name="semester" class="form-control" required>
                          <option value="">Select Semester</option>
                          {% for s in semesters %}
                            <option value="{{ s.semester_id }}">{{ s.term }} {{ s.academic_year }}</option>
                          {% endfor %}
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>Is Available</strong></td>
                      <td>
                        <div class="form-check">
                          <input type="checkbox" name="isavailable" id="isavailable" class="form-check-input" {% if form.isavailable.value %}checked{% endif %}>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>Start Time</strong></td>
                      <td><input type="time" name="start_time" class="form-control" required></td>
                    </tr>
                    <tr>
                      <td><strong>End Time</strong></td>
                      <td><input type="time" name="end_time" class="form-control" required></td>
                    </tr>
                    <tr>
                      <td><strong>Day</strong></td>
                      <td>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" name="day" value="Sunday" id="day-sun">
                          <label class="form-check-label" for="day-sun">Sunday</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" name="day" value="Monday" id="day-mon">
                          <label class="form-check-label" for="day-mon">Monday</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" name="day" value="Tuesday" id="day-tue">
                          <label class="form-check-label" for="day-tue">Tuesday</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" name="day" value="Wednesday" id="day-wed">
                          <label class="form-check-label" for="day-wed">Wednesday</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" name="day" value="Thursday" id="day-thu">
                          <label class="form-check-label" for="day-thu">Thursday</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" name="day" value="Friday" id="day-fri">
                          <label class="form-check-label" for="day-fri">Friday</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" name="day" value="Saturday" id="day-sat">
                          <label class="form-check-label" for="day-sat">Saturday</label>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="custom-btn-save">
                  <i class="fa fa-save"></i> Save Course
                </button>
                <button type="button" class="custom-btn-cancel" onclick="resetForm();">
                  <i class="fa fa-times-circle"></i> Cancel / Reset
                </button>
                <button type="button" class="custom-btn-close" onclick="window.location.href='{% url 'admin_courses_manage' %}';">
                  <i class="fa fa-times-circle"></i> Close
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function resetForm() {
    document.getElementById("courseForm").reset();
  }
</script>

<style>
  .custom-btn-save {
    background-color: #1572e8 !important;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background-color 0.3s;
  }
  .custom-btn-save:hover {
    background-color: #0e5bb5 !important;
  }
  .custom-btn-cancel {
    background-color: #f44336;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background-color 0.3s;
  }
  .custom-btn-cancel:hover {
    background-color: #e53935;
  }
  .custom-btn-close {
    background-color: #00df30;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background-color 0.3s;
  }
  .custom-btn-close:hover {
    background-color: #009e0d;
  }
  .form-control {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: white;
  }
  select.form-control {
    height: auto;
  }
  .table td {
    vertical-align: middle;
  }
  .form-check-input {
    width: 18px;
    height: 18px;
    margin-top: 0.3rem;
  }
  .form-check-label {
    margin-left: 0.5rem;
  }
</style>
{% endblock %}
